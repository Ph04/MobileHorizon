name: Inspect Android app sources

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/inspect-android-source.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble app source and inspect Android integration points
        shell: bash
        run: |
          set -euo pipefail
          cat HorizonAndroidPrep_0.9.7_with_native.zip.part-00 HorizonAndroidPrep_0.9.7_with_native.zip.part-01 HorizonAndroidPrep_0.9.7_with_native.zip.part-02 > /tmp/prep.zip
          echo 'c3e8de14e3beacbff203f2134afabe3fb801bea8eda7de42491aacfe00a2b302  /tmp/prep.zip' | sha256sum -c -
          unzip -q /tmp/prep.zip -d /tmp/source
          cd /tmp/source/HorizonAndroidPrep
          echo '=== APP SOURCE TREE ==='
          find app/src/main -type f -print | sort
          echo '=== APP GRADLE ==='
          sed -n '1,220p' app/build.gradle
          echo '=== MANIFEST ==='
          sed -n '1,240p' app/src/main/AndroidManifest.xml
          echo '=== JAVA / KOTLIN ==='
          find app/src/main -type f \( -name '*.java' -o -name '*.kt' \) -print0 | while IFS= read -r -d '' f; do
            echo "=== $f ==="
            sed -n '1,320p' "$f"
          done
          echo '=== METHOD INDEX ==='
          grep -nE 'buildUi|setStatus|startOfficialDownload|installInProgress|PICK_PREPARED_RESOURCE_TREE|onActivityResult|setContentView|requestPermissions' app/src/main/java/dev/horizon/androidprep/MainActivity.java || true
          echo '=== UI AND STATUS IMPLEMENTATION ==='
          sed -n '500,585p' app/src/main/java/dev/horizon/androidprep/MainActivity.java
          sed -n '1110,1150p' app/src/main/java/dev/horizon/androidprep/MainActivity.java
          echo '=== RESOURCE UI XML ==='
          find app/src/main/res/values -type f 2>/dev/null | sort | while read -r f; do
            case "$f" in
              *.xml) echo "=== $f ==="; sed -n '1,220p' "$f";;
            esac
          done